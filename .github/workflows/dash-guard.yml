# dash-guard in CI: the house rule that published prose carries no en/em dash (the ASCII hyphen is
# code syntax and is left alone). Runtime output is normalized in the skill's _inline renderer; this
# gate keeps the docs and source comments clean. Style, not security, so it scans the current tree
# only (a dash in old history is harmless and needs no rewrite).
name: dash-guard

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # Run the guard's OWN tests first, exactly as the pii-guard workflow does. The reason is not
      # symmetry: until 2026-07-30 a git failure (not a repo, no git on PATH, an index lock, an
      # extracted archive) made the scanner enumerate zero files and print "dash_guard: clean" with
      # exit 0. This job's entire content is that one command, so a run that examined nothing
      # reported success. The regression for it lives in these tests, and a test CI does not run is
      # not a test -- this suite shipped nowhere at all before now.
      - name: Guard's own tests (a scan that never ran must not report clean)
        run: |
          python -m pip install --quiet pytest
          # The explicit probe is about the MESSAGE, not the verdict: pytest already exits 4 on a
          # path it cannot find, so a missing suite has always failed this step. But "ERROR: file or
          # directory not found" reads like a workflow typo, and the actual meaning is that a guard
          # went missing from the repo. Say that instead. (Matched to the wording pii-guard.yml uses
          # for the same absence, so the three guards answer a missing file identically.)
          test -f tools/test_dash_guard.py || { echo "::error::tools/test_dash_guard.py is MISSING -- re-vendor it (install.py); an unproven guard is not a guard"; exit 1; }
          python -m pytest tools/test_dash_guard.py -q

      - name: No en/em dash in published prose
        run: |
          test -f tools/dash_guard.py || { echo "::error::tools/dash_guard.py is MISSING -- re-vendor it (install.py); an absent gate is not a passing gate"; exit 1; }
          python tools/dash_guard.py --tree
