# load-budget in CI: PHILOSOPHY P7, the always-loaded budget and the no-second-copy rule.
#
# WHY THIS FILE EXISTS AT ALL
# ---------------------------
# tools/load_budget.py was vendored into 18 repos and wired into nothing. It ran on no push, no
# hook, no schedule. A control that executes nowhere is not a weak control, it is the absence of one
# wearing the costume of a control: a reader greps the repo, sees a P7 gate sitting next to the
# guards that do run, and reasonably concludes P7 is enforced. That is the exact failure the guard
# effort was chartered to eliminate, so shipping it inert reintroduced the disease in 18 places.
# Either it runs or it stops being carried. This is it running.
#
# It is a STYLE/ARCHITECTURE gate, not a security one, so like dash-guard it scans the current tree
# only. There is nothing to rewrite in history: a paragraph that was duplicated last year and has
# since been cut is not a live defect.
name: load-budget

on:
  push:
  pull_request:

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The guard's OWN tests, first, exactly as dash-guard and pii-guard do it. This step did not
      # exist until 2026-08-27 because the tests did not exist, and that gap was the interesting one:
      # of the three guards vendored here, this was the only one shipping as a CI gate with nothing
      # proving it could still fail. It was also the one that needed it most, because HALF OF IT
      # COULD NOT FAIL. `dup_pct` over the threshold blocked; `always_loaded_lines` over
      # ALWAYS_LOADED_WARN printed a note and the row still read "ok". So the gate named for the
      # always-loaded budget enforced no always-loaded budget, and no test anywhere would have
      # noticed, because there were no tests.
      #
      # tools/test_load_budget.py now pairs every guarantee with a NEGATIVE CONTROL: an over-budget
      # SKILL.md that must exit 1, a duplicated paragraph that must exit 1, a threshold flipped across
      # the same fixture that must flip the verdict, an empty SKILL.md that must not read as clean,
      # and a repo with no SKILL.md at all that must exit 3. Verified by breaking the tool four
      # different ways and watching the matching tests go red each time.
      - name: Guard's own tests (a budget that cannot be exceeded is not a budget)
        run: |
          python -m pip install --quiet pytest
          test -f tools/test_load_budget.py || { echo "::error::tools/test_load_budget.py is MISSING -- re-vendor it (install.py). Without it this workflow runs an unproven gate, which is how the always-loaded half sat inert."; exit 1; }
          python -m pytest tools/test_load_budget.py -q

      # NOT wrapped in `if [ -f ... ]`, for the reason the pii-guard workflow spells out at length:
      # a step that skips itself when its own subject is missing reports success for a run that
      # examined nothing. install.py ships this file, so ABSENT is a failure, not a reason to skip.
      #
      # The `exit 3` case is the one this step exists to make load: load_budget exits 3 when it
      # located no SKILL.md and therefore MEASURED NOTHING. That used to be exit 2 and was blessed
      # in the docstring as "a state, not a failure", which let the tool report a calm clean result
      # on the two repos holding the largest always-loaded files in the fleet. GitHub fails a step
      # on any nonzero status, so 3 fails here with no special handling -- but it is named
      # explicitly below so that nobody later "helpfully" adds a `|| true` or an exit-code filter
      # and restores the silence. Verified by running a repo in that state and observing rc=3.
      - name: Always-loaded budget + SKILL.md-vs-reference duplication (P7)
        run: |
          test -f tools/load_budget.py || { echo "::error::tools/load_budget.py is MISSING -- re-vendor it (install.py); an absent gate is not a passing gate"; exit 1; }
          python tools/load_budget.py .
          # (no `|| true`, and no exit-code filtering: 1 = over budget, 3 = measured nothing.
          #  Both are failures. A run that measured nothing has cleared nothing.)
          #
          # Since 2026-08-27, exit 1 covers THREE conditions, and the report names which one fired:
          #   dup_pct over --max-dup          the same sentence lives in SKILL.md and in a reference
          #   lines over --max-lines          the always-loaded budget itself, the half that used to
          #                                   print a note and pass anyway
          #   zero shingles                   a SKILL.md too short to yield one 8-word run of prose,
          #                                   i.e. empty or truncated, which neither half measured
          # The third is there because dup_pct has two ways to come out 0.00%: nothing matched, or
          # nothing was compared. Those now print differently ("0.00%" vs "NOT CHECKED" vs "NOT
          # MEASURED") so a reader can tell a clean sweep from an empty one.
