# pii_guard in CI -- the authority.
#
# The local hooks are a fast fail, not a guarantee. On 2026-07-13 a pre-commit hook printed its
# findings and let the commit through anyway, because the caller had piped `git commit` into `head`
# and the severed pipe destroyed the guard's exit status. A local hook can also be skipped with
# --no-verify, is not installed on a fresh clone until someone runs the installer, and does not exist
# at all for a contributor.
#
# This runs on GitHub, on every push and every PR, and it cannot be reached by any of that. If a leak
# gets past the desk, this is what turns it from a silent permanent exposure into a red X.
#
# Note it runs WITHOUT the operator's private denylist (that file never leaves their machine). That
# is the whole point of the allowlist design: the structural checks -- a mailbox at a consumer
# provider, a real phone, a home ZIP, a non-noreply commit author, anything outside the declared
# synthetic namespace -- need no private data to work, so they work here too.
name: pii-guard

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the history scan is the point; a shallow clone would see nothing

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Guard's own tests (does it still catch the leaks it was built for?)
        run: |
          python -m pip install --quiet pytest
          # This step was the one file probe missing from the set below. pytest exits 4 on an absent
          # path so it never failed OPEN, but it reported the absence as a path typo rather than as a
          # missing guard, and an inconsistent posture is how the next person decides which of the
          # two patterns is the intended one.
          test -f tools/test_pii_guard.py || { echo "::error::tools/test_pii_guard.py is MISSING -- re-vendor it (install.py); THE AUTHORITY cannot run on an unproven scanner"; exit 1; }
          python -m pytest tools/test_pii_guard.py -q

      # The v2 policy-layer suite. Not optional and not wrapped in a file test, for the same reason
      # as the steps below: a repo whose vendored copy went missing would otherwise go green on a
      # step that never ran.
      #
      # These tests are about a layer that DOES NOT EXIST ON THIS RUNNER. There is no private
      # denylist in CI and there never will be, so what is verified here is the SHAPE of the policy
      # machinery: that an unknown format raises instead of guessing, that a missing canary or a
      # wrong count is refused rather than half-loaded, that a derivable companion name is admitted
      # as reportable rather than blocking, and that a history-only exemption does not reach live
      # content. Every one of those is a property of the code, checkable with synthetic fixtures,
      # and every one of them is a property whose violation used to be silent.
      - name: Policy-layer tests (can the private layer still prove it loaded?)
        run: |
          test -f tools/test_pii_guard_v2.py || { echo "::error::tools/test_pii_guard_v2.py is MISSING -- re-vendor it (install.py)"; exit 1; }
          python -m pytest tools/test_pii_guard_v2.py -q

      # The resolver's tests. datadir.py decides WHERE real-run output goes, which makes it the one
      # file no downstream scanner can compensate for. A resolver that silently answers None looks
      # exactly like a skill that has no data, and that ambiguity is how the out-of-band boundary
      # check reported a clean sheet over skills writing a live ledger every day.
      #
      # NOT wrapped in `if [ -f ... ]`. Both steps used to be, and that made THE AUTHORITY fail open:
      # a repo whose vendored copy was missing (a stale default branch, a bad merge, a deletion) went
      # green on a step that never ran. Every repo in this fleet is supposed to carry these files --
      # install.py ships them -- so ABSENT is a failure, not a reason to skip. Verified 2026-07-31 by
      # deleting each file and watching the step exit non-zero.
      - name: Resolver tests (does the data pipe still point outside this repo?)
        run: |
          test -f tools/test_datadir.py || { echo "::error::tools/test_datadir.py is MISSING -- re-vendor it (install.py); a guard that is not here is not a guard"; exit 1; }
          python -m pytest tools/test_datadir.py -q

      # The primary control's OWN tests. This file ships 84 of them, every one a negative control
      # for the gate below, and until now NO job ran a single one. The data boundary therefore
      # shipped with a proof it can still fail that nothing ever executed, which is the same shape
      # as the gate that runs and checks nothing: a reader greps the repo, finds a large negative
      # control suite next to the control, and concludes the control is proven.
      #
      # It matters more here than for the other three guards, because this is the control the
      # other three cannot compensate for. pii_guard reads content and looks for what SMELLS
      # private; a ticker with an entry price smells of nothing. If data_boundary regresses, the
      # backstop below stays green over a repo full of somebody's life.
      #
      # NOT wrapped in a file test that skips, for the reason every step here says: absent is a
      # failure. pytest exits 4 on a path it cannot find, so this never failed open, but "file or
      # directory not found" reads as a workflow typo rather than as a guard that went missing.
      - name: Boundary tests (can the primary control still fail?)
        run: |
          test -f tools/test_data_boundary.py || { echo "::error::tools/test_data_boundary.py is MISSING -- re-vendor it (install.py); the PRIMARY control cannot judge this repo on an unproven scanner"; exit 1; }
          python -m pytest tools/test_data_boundary.py -q

      # The DATA BOUNDARY -- the primary control. Runs FIRST, because it is the question that
      # actually matters: is this repo an uninitialized tool, or does it contain somebody's life?
      #
      # pii_guard (below) is the backstop. It reads content and looks for things that SMELL private,
      # which is why it was clean while a public repo held real-run output from the operator's own account
      # and a full record of their private activity. A ticker with an entry price has no email in
      # it, no phone, no ZIP -- nothing to smell. The scanner cannot see a leak that looks like data,
      # so the boundary has to make the leak structurally impossible instead: no DATA-class path is
      # tracked, every declared DATA path ships only a schema, and every FIXTURE must be byte-
      # identical to what its generator emits -- because a real record cannot be regenerated.
      #
      # A missing SCANNER is caught here: see the note on the step above.
      #
      # The .dataclass.json probe below is deliberately KEPT even though it is no longer load
      # bearing. Its old wording claimed data_boundary "would exit 0 on every run" without a
      # manifest, and that was true until 2026-08-28: `rm .dataclass.json` was a one-line route
      # past the primary control. The tool now returns 3 (NOT ARMED) instead, and the step above
      # pins that with tools/test_data_boundary.py::test_no_manifest_is_reported_as_not_armed_not
      # _as_clean. So this line is now a SECOND, independent statement of the same policy rather
      # than the only one, which is the difference between defense in depth and a workaround
      # standing in for a property of the gate. It stays because a probe that names the missing
      # file costs one process and reads better than an exit code, and because the hooks that run
      # the same tool locally reach the same verdict through the tool alone -- one policy, two
      # places that agree, instead of two places that disagree.
      - name: Data boundary (is this an uninitialized tool?)
        run: |
          test -f tools/data_boundary.py || { echo "::error::tools/data_boundary.py is MISSING -- re-vendor it (install.py); the PRIMARY control cannot be optional"; exit 1; }
          test -f .dataclass.json || { echo "::error::.dataclass.json is MISSING -- checks 1, 2, 3 and 5 of the primary control have nothing to assert against. data_boundary itself now exits 3 (NOT ARMED) on this, so both this line and the tool refuse it; neither is allowed to be the only one saying so."; exit 1; }
          python tools/data_boundary.py

      - name: Scan working tree + full history
        run: |
          test -f tools/pii_guard.py || { echo "::error::tools/pii_guard.py is MISSING -- re-vendor it (install.py); the backstop scan cannot be optional"; exit 1; }
          # --history is meaningless without real history. checkout is configured with fetch-depth: 0
          # above, but a shallow clone would still SCAN and still exit 0, having seen one commit, so
          # the condition is asserted here rather than trusted. pii_guard itself raises GitError when
          # git cannot enumerate, which covers the no-repo case; this covers the subtler one where
          # git works fine and the history simply is not there.
          test -d .git || { echo "::error::no .git in the workspace: the history scan would examine nothing and still pass"; exit 1; }
          # The probe is decided on the ANSWER, never on the absence of a "true". Written as
          # `if [ "$(git rev-parse --is-shallow-repository)" = "true" ]` it fails OPEN in every case
          # where git does not answer at all: a git too old for that flag, a corrupt .git/shallow, a
          # broken repository. The command substitution comes back empty, empty is not "true", and
          # the step proceeds to run a history scan over a history it never established was there.
          # Measured: with a malformed .git/shallow, git printed "fatal: bad shallow line" to stderr
          # and that form of the check waved the step through. So: capture the status, then require
          # the literal answer "false" and treat anything else, including success with unexpected
          # output, as a failure.
          shallow=$(git rev-parse --is-shallow-repository 2>&1) || {
            echo "::error::git could not say whether this checkout is shallow: $shallow"
            echo "::error::--history is only meaningful over real history. Refusing to scan and call it clean."
            exit 1
          }
          case "$shallow" in
            false) : ;;
            true)
              echo "::error::this checkout is SHALLOW. --history would scan only the fetched commits and report clean over everything older. Restore fetch-depth: 0 on actions/checkout."
              exit 1 ;;
            *)
              echo "::error::unexpected answer from git rev-parse --is-shallow-repository: '$shallow'. Expected exactly 'true' or 'false'; anything else means the depth of this checkout is unknown, and unknown depth is not a pass."
              exit 1 ;;
          esac
          python tools/pii_guard.py --tree --history
